[project]
name = "apex-spec"
version = "0.1.0"
description = "Core utilities for APEX adaptive speculative decoding experiments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = [
  "torch",
  "transformers",
  "peft",
  "datasets",
  "accelerate"
]

[project.scripts]
apex = "apex.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
